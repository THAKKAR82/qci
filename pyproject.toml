[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qci"
version = "0.0.1"
description = "Vendor-neutral reliability and execution intelligence for quantum workloads (V1: Quantum CI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "typer>=0.20",
    "sqlalchemy>=2.0,<3",
    # Seeded resampling for the TVD sampling floor (qci/compare/sampling.py).
    "numpy>=2,<3",
    "qiskit>=2.5,<3",
    "qiskit-ibm-runtime>=0.50",
    "qiskit-aer>=0.17",
    # OpenQASM 3 reference parser (vendor-neutral). Its AST API is an external compatibility
    # boundary isolated in qci/compare/footprint.py; see docs/adr/0004.
    "openqasm3[parser]>=1.0.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
]

[project.scripts]
qci = "qci.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qci"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true

[[tool.mypy.overrides]]
module = ["qiskit.*", "qiskit_ibm_runtime.*", "qiskit_aer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly: on this macOS setup the editable-install .pth can be hidden
# and skipped by Python 3.13 (see CLAUDE.md, Troubleshooting).
pythonpath = ["src"]
addopts = "-ra"
